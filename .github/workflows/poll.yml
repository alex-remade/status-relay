name: Poll competitor status pages
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch status feeds
        run: ./fetch.sh
      - name: Commit if changed
        run: |
          git config user.name "status-relay-bot"
          git config user.email "actions@github.com"
          git add status.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "status update $(date -u +%FT%TZ)"
          git push
